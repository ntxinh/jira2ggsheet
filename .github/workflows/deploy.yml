name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/workers/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/workers/**'
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/workers
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: src/workers/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/workers
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/workers/package-lock.json
      - run: npm ci
      - run: npx wrangler deploy --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
